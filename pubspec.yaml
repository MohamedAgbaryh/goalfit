name: GoalFit
description: A fitness tracking app with WebView and login functionality.

publish_to: 'none'  # Prevents accidental publishing

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ✅ WebView to embed a website in your app
  webview_flutter: ^4.2.2

  # ✅ Google Fonts for better typography
  google_fonts: ^6.1.0

  # ✅ Flutter SVG for handling SVG images (optional)
  flutter_svg: ^2.0.9

  # ✅ Flutter Secure Storage (optional - for storing login credentials)
  flutter_secure_storage: ^9.0.0

  # ✅ Cached Network Image (for better performance)
  cached_network_image: ^3.3.0
  fl_chart: ^0.70.2

  # ✅ Missing Cupertino Icons (Fixed)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/progress.png  # ✅ Ensure this file exists in your project
    - assets/images/logo.png      # ✅ Your app logo
    - assets/images/onboarding1.jpg
    - assets/images/onboarding2.jpg
    - assets/images/onboarding3.jpg
    - assets/images/login.jpg
    - assets/images/cycling.jpg
    - assets/images/run.jpg
    - assets/images/pushups.webp
    - assets/images/workoutbackground.jpg

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
